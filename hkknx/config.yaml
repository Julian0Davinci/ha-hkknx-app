name: "HKKNX (Store)"
version: "0.2.2"
slug: "hkknx"
description: "HomeKit + KNX Bridge von brutella mit persistenten Daten"
url: "https://github.com/brutella/hkknx-public"
arch:
  - aarch64
  - armv7
  - amd64
startup: services
boot: auto
init: false
host_network: true
# Home Assistant Supervisor retains /data between app rebuilds and upgrades.
backup: cold
ingress: true
ingress_port: 8080
panel_icon: mdi:home-automation
panel_title: "HKKNX"
panel_admin: true
webui: "http://[HOST]:8080"
