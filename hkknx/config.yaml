name: "HKKNX (Store)"
version: "0.2.3"
slug: "hkknx"
description: "HomeKit + KNX Bridge von brutella mit persistenten Daten"
url: "https://github.com/brutella/hkknx-public"
arch:
  - aarch64
  - armv7
  - amd64
startup: services
boot: auto
init: false
host_network: true
backup: cold
# Use the separate Ingress adapter; keep the native HKKNX UI on 8080.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-automation
panel_title: "HKKNX"
panel_admin: true
webui: "http://[HOST]:[PORT:8080]"
