name: Check HKKNX Docker image
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Docker digest and update changelog
        run: python .github/scripts/check_upstream.py
      - name: Commit changed app metadata
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hkknx/config.yaml hkknx/Dockerfile hkknx/CHANGELOG.md .upstream-digest
            git commit -m "chore: update HKKNX image and changelog"
            git push
          else
            echo "Upstream unchanged"
          fi
